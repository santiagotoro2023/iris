<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRiS — Sign in</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root {
    --orange: #FF7A1A; --bg: #0e0f11; --panel: #16181c; --line: #2a2e35;
    --text: #e6e8ea; --dim: #8b929c;
    --sans: "Space Grotesk", "Inter", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text); font-family: var(--sans);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px; background-position: -1px -1px;
  }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 0%, transparent 0%, var(--bg) 78%); }
  main { position: relative; width: min(92vw, 380px); }
  .brand { display: flex; align-items: center; gap: .7rem; justify-content: center;
           margin-bottom: 1.5rem; }
  h1 { font-size: 1.3rem; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
  h1 span { color: var(--orange); }
  form { border: 1px solid var(--line); background: var(--panel); padding: 1.4rem; }
  h2 { font-family: var(--mono); font-size: .7rem; letter-spacing: .18em;
       text-transform: uppercase; color: var(--orange); margin: 0 0 1.1rem; }
  label { display: block; font-size: .82rem; margin: 0 0 .25rem; }
  input { width: 100%; padding: .55rem .6rem; margin-bottom: .9rem; background: #0b0c0e;
          color: var(--text); border: 1px solid var(--line); font-family: var(--mono);
          font-size: .88rem; }
  button { width: 100%; padding: .6rem; background: var(--orange); color: #14161a;
           border: 0; font-family: var(--sans); font-weight: 600; font-size: .9rem;
           letter-spacing: .04em; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
  .msg { font-family: var(--mono); font-size: .74rem; min-height: 1.2rem; margin-top: .7rem; }
  .err { color: #ff6b6b; }
  .note { color: var(--dim); font-size: .76rem; line-height: 1.5; margin: 0 0 1rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="logo.svg" alt="" width="34" height="34">
    <h1>IR<span>i</span>S</h1>
  </div>

  <form id="login-form">
    <h2>Sign in</h2>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="msg" id="login-msg" role="status" aria-live="polite"></div>
  </form>

  <form id="change-form" class="hidden">
    <h2>Choose a new password</h2>
    <p class="note">This account still uses its initial password. Pick a new one to continue.</p>
    <label for="np">New password</label>
    <input id="np" type="password" autocomplete="new-password" minlength="8" required>
    <label for="np2">Repeat new password</label>
    <input id="np2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Set password</button>
    <div class="msg" id="change-msg" role="status" aria-live="polite"></div>
  </form>
</main>

<script>
const $ = s => document.querySelector(s);
let currentPassword = null;

async function post(url, body) {
  const r = await fetch(url, {
    method: "POST", headers: {"content-type": "application/json"},
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `error ${r.status}`);
  return data;
}

$("#login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("#login-msg");
  msg.textContent = "signing in…";
  msg.className = "msg";
  try {
    const data = await post("auth/login", {
      username: $("#u").value, password: $("#p").value,
    });
    if (data.user.must_change_password) {
      currentPassword = $("#p").value;
      $("#login-form").classList.add("hidden");
      $("#change-form").classList.remove("hidden");
      $("#np").focus();
      return;
    }
    location.href = "./";
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "msg err";
  }
});

$("#change-form").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("#change-msg");
  if ($("#np").value !== $("#np2").value) {
    msg.textContent = "passwords do not match";
    msg.className = "msg err";
    return;
  }
  msg.textContent = "saving…";
  msg.className = "msg";
  try {
    await post("auth/password", {
      current_password: currentPassword, new_password: $("#np").value,
    });
    location.href = "./";
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "msg err";
  }
});
</script>
</body>
</html>
