<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRiS — Sign in</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  body { display: grid; place-items: center; }
  main { position: relative; z-index: 1; width: min(92vw, 380px); }
  .brand { display: flex; align-items: center; gap: .7rem; justify-content: center;
           margin-bottom: 1.4rem; }
  form { border: 1px solid var(--line); background: var(--panel); padding: 1.4rem; }
  form > h2 { font-family: var(--mono); font-size: .68rem; letter-spacing: .18em;
              text-transform: uppercase; color: var(--orange); margin: 0 0 1.1rem; }
  .field { margin-bottom: .9rem; }
  .field label { display: block; font-size: .82rem; margin-bottom: .25rem; }
  .btn { width: 100%; margin-top: .3rem; }
  .note { color: var(--dim); font-size: .76rem; line-height: 1.5; margin: 0 0 1rem; }
  .hidden { display: none; }
  .hint { font-family: var(--mono); font-size: .68rem; color: var(--dim); margin-top: .3rem; }
  .hint.err { color: var(--err); }
  .formmsg { font-family: var(--mono); font-size: .74rem; min-height: 1.2rem;
             margin-top: .7rem; }
  .formmsg.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="logo.svg" alt="" width="34" height="34">
    <h1 class="wordmark">IR<span>i</span>S</h1>
  </div>

  <!-- novalidate: validation messages are drawn by the app, not the browser -->
  <form id="login-form" novalidate>
    <h2>Sign in</h2>
    <div class="field">
      <label for="u">Username</label>
      <input class="input" id="u" autocomplete="username" autofocus>
      <div class="hint" id="u-hint"></div>
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input class="input" id="p" type="password" autocomplete="current-password">
      <div class="hint" id="p-hint"></div>
    </div>
    <button class="btn" type="submit">Sign in</button>
    <div class="formmsg" id="login-msg" role="status" aria-live="polite"></div>
  </form>

  <form id="change-form" class="hidden" novalidate>
    <h2>Choose a new password</h2>
    <p class="note">This account still uses its initial password. Pick a new one to continue.</p>
    <div class="field">
      <label for="np">New password</label>
      <input class="input" id="np" type="password" autocomplete="new-password">
      <div class="hint" id="np-hint">at least 8 characters</div>
    </div>
    <div class="field">
      <label for="np2">Repeat new password</label>
      <input class="input" id="np2" type="password" autocomplete="new-password">
      <div class="hint" id="np2-hint"></div>
    </div>
    <button class="btn" type="submit">Set password</button>
    <div class="formmsg" id="change-msg" role="status" aria-live="polite"></div>
  </form>
</main>

<script src="app.js"></script>
<script>
const {$, send} = window.IRiS;
let initialPassword = null;

function mark(id, message) {
  const input = $("#" + id), hint = $("#" + id + "-hint");
  input.classList.toggle("invalid", !!message);
  hint.textContent = message || (id === "np" ? "at least 8 characters" : "");
  hint.className = "hint" + (message ? " err" : "");
  return !message;
}

function setMsg(id, text, isError) {
  const n = $("#" + id);
  n.textContent = text;
  n.className = "formmsg" + (isError ? " err" : "");
}

$("#login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const ok = [
    mark("u", $("#u").value.trim() ? "" : "enter a username"),
    mark("p", $("#p").value ? "" : "enter a password"),
  ].every(Boolean);
  if (!ok) return;

  setMsg("login-msg", "signing in…", false);
  try {
    const data = await send("auth/login", {
      username: $("#u").value.trim(), password: $("#p").value,
    });
    if (data.user.must_change_password) {
      initialPassword = $("#p").value;
      $("#login-form").classList.add("hidden");
      $("#change-form").classList.remove("hidden");
      $("#np").focus();
      return;
    }
    location.href = "./";
  } catch (err) {
    setMsg("login-msg", err.message, true);
  }
});

$("#np").addEventListener("input", () => {
  if ($("#np").value.length >= 8) mark("np", "");
});

$("#change-form").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("#np").value, pw2 = $("#np2").value;
  const ok = [
    mark("np", pw.length >= 8 ? "" : `too short, ${8 - pw.length} more character(s)`),
    mark("np2", pw2 === pw ? "" : "passwords do not match"),
  ].every(Boolean);
  if (!ok) return;

  setMsg("change-msg", "saving…", false);
  try {
    await send("auth/password", {current_password: initialPassword, new_password: pw});
    location.href = "./";
  } catch (err) {
    setMsg("change-msg", err.message, true);
  }
});
</script>
</body>
</html>
