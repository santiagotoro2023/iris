<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRiS</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <img src="logo.svg" alt="" width="34" height="34">
    <h1 class="wordmark">IR<span>i</span>S</h1>
    <span class="spacer"></span>
    <span class="key" id="hud-user">—</span>
    <button class="ghost" id="logout" type="button">sign out</button>
  </header>

  <div class="hud">
    <span><span id="dot" class="dot"></span><b id="conn">connecting</b></span>
    <span>model <b id="hud-model">—</b></span>
    <span>reasoning <b id="hud-think">—</b></span>
    <span>ollama <b id="hud-ollama">—</b></span>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-view="chat">Chat</button>
    <button class="tab" role="tab" aria-selected="false" data-view="settings">Settings</button>
    <button class="tab" role="tab" aria-selected="false" data-view="activity">Activity</button>
  </nav>

  <section class="view active" id="view-chat" role="tabpanel">
    <div class="chat-wrap">
      <aside class="conv-panel">
        <div class="conv-head">
          <span>Conversations</span>
          <button class="ghost" id="new-chat" type="button">new</button>
        </div>
        <div class="conv-list" id="conv-list" role="list"></div>
      </aside>
      <div class="chat-main">
        <div class="chat-log" id="chat-log"></div>
        <div class="composer">
          <button class="mic" id="mic" type="button" aria-label="Record a message"
                  aria-pressed="false" title="Record a message">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
              <rect x="9" y="3" width="6" height="11" rx="3"/>
              <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>
            </svg>
          </button>
          <textarea id="composer" rows="1" placeholder="Ask IRiS…"
                    aria-label="Message"></textarea>
          <button class="btn" id="send" type="button">Send</button>
        </div>
      </div>
    </div>
  </section>

  <section class="view" id="view-settings" role="tabpanel">
    <div id="groups"></div>
  </section>

  <section class="view" id="view-activity" role="tabpanel">
    <div class="panel">
      <h2>Activity &amp; audit log</h2>
      <div id="activity-list"><div class="empty">loading…</div></div>
    </div>
  </section>
</div>

<script src="app.js"></script>
<script>
const {$, el, api, json, send, Combo, Stepper, Toggle} = window.IRiS;
let SCHEMA = {}, VALUES = {}, CONTROLS = {}, CONV = null, BUSY = false;

/* ---------------------------------------------------------------- tabs -- */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t =>
      t.setAttribute("aria-selected", String(t === tab)));
    document.querySelectorAll(".view").forEach(v =>
      v.classList.toggle("active", v.id === "view-" + tab.dataset.view));
    if (tab.dataset.view === "activity") loadActivity();
  });
});

$("#logout").addEventListener("click", async () => {
  await fetch("auth/logout", {method: "POST"});
  location.href = "login.html";
});

/* ------------------------------------------------------------ settings -- */
function rowFor(key, spec) {
  const row = el("div", "row");
  const id = "f-" + key.replace(/\./g, "-");
  const label = el("label", null, spec.title || key);
  label.id = id + "-label";
  label.htmlFor = id;
  row.append(label);
  if (spec.description) row.append(el("div", "desc", spec.description));

  const status = el("div", "status");
  const commit = v => save(key, v, status);
  let control;

  if (spec.enum) {
    control = Combo({options: spec.enum, value: VALUES[key], onChange: commit,
                     labelledBy: label.id});
  } else if (spec.type === "boolean") {
    control = Toggle({checked: VALUES[key], onChange: commit, labelledBy: label.id});
  } else if (spec.type === "integer" || spec.type === "number") {
    control = Stepper({value: VALUES[key], min: spec.minimum, max: spec.maximum,
                       step: spec.type === "integer" ? 1 : 0.1, onChange: commit, id});
  } else {
    control = el("input", "input");
    control.type = "text";
    control.id = id;
    control.value = VALUES[key] ?? "";
    let t;
    control.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => commit(control.value), 600);
    });
    control.setValue = v => { control.value = v ?? ""; };
  }

  CONTROLS[key] = control;
  row.append(control, status, el("div", "key", key));
  return row;
}

function renderSettings() {
  const groups = {};
  for (const [key, spec] of Object.entries(SCHEMA)) {
    const g = key.includes(".") ? key.split(".")[0] : "general";
    (groups[g] ||= []).push([key, spec]);
  }
  const root = $("#groups");
  root.textContent = "";
  for (const [name, items] of Object.entries(groups)) {
    const sec = el("section", "panel");
    sec.style.marginBottom = "1.1rem";
    sec.append(el("h2", null, name));
    items.forEach(([k, s]) => sec.append(rowFor(k, s)));
    root.append(sec);
  }
}

async function save(key, value, status) {
  status.textContent = "saving…";
  status.className = "status";
  try {
    VALUES = await send("settings/values", {[key]: value}, "PUT");
    status.textContent = "saved";
    status.className = "status ok";
    setTimeout(() => { status.textContent = ""; }, 1800);
    refreshHud();
  } catch (e) {
    status.textContent = e.message;
    status.className = "status err";
  }
}

/* ---------------------------------------------------------------- chat -- */
function bubble(role, content) {
  const m = el("div", "msg " + role);
  m.append(el("div", "msg-role", role === "assistant" ? "IRiS" : role));
  m.append(el("div", null, content));
  return m;
}

function paintChat(messages) {
  const log = $("#chat-log");
  log.textContent = "";
  for (const m of messages) {
    if (m.role === "user") log.append(bubble("user", m.content));
    else if (m.role === "tool") log.append(bubble("tool", `${m.tool_name} → ${m.content}`));
    else if (m.role === "assistant" && (m.content || "").trim())
      log.append(bubble("assistant", m.content));
  }
  log.scrollTop = log.scrollHeight;
}

function thinkingBubble() {
  const m = el("div", "msg assistant");
  m.append(el("div", "msg-role", "IRiS"));
  const t = el("div", "thinking");
  t.append(el("i"), el("i"), el("i"));
  m.append(t);
  return m;
}

async function sendMessage() {
  const box = $("#composer");
  const text = box.value.trim();
  if (!text || BUSY) return;
  BUSY = true;
  $("#send").disabled = true;
  box.value = "";
  box.style.height = "auto";

  const log = $("#chat-log");
  log.append(bubble("user", text));
  const pending = thinkingBubble();
  log.append(pending);
  log.scrollTop = log.scrollHeight;

  try {
    const r = await send("chat/message", {content: text, conversation_id: CONV});
    CONV = r.conversation_id;
    paintChat(r.messages);
    loadConversations();
  } catch (e) {
    pending.remove();
    const err = bubble("tool", "error: " + e.message);
    log.append(err);
  } finally {
    BUSY = false;
    $("#send").disabled = false;
    box.focus();
  }
}

$("#send").addEventListener("click", sendMessage);
$("#composer").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$("#composer").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 144) + "px";
});
$("#new-chat").addEventListener("click", () => {
  CONV = null;
  paintChat([]);
  document.querySelectorAll(".conv-item").forEach(n =>
    n.setAttribute("aria-current", "false"));
  $("#composer").focus();
});

async function openConversation(id) {
  CONV = id;
  paintChat((await json(`chat/conversations/${id}`)).messages);
  document.querySelectorAll(".conv-item").forEach(n =>
    n.setAttribute("aria-current", String(n.dataset.id === id)));
}

/* --------------------------------------------------------------- voice -- */
let recorder = null, chunks = [];

function micState({recording = false, busy = false, disabled = false, title} = {}) {
  const mic = $("#mic");
  mic.setAttribute("aria-pressed", String(recording));
  mic.classList.toggle("busy", busy);
  mic.disabled = disabled;
  if (title) mic.title = title;
}

$("#mic").addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }

  // getUserMedia needs a secure context: localhost is fine, plain http over
  // Tailscale is not. `tailscale serve` terminates TLS if you need it remotely.
  if (!navigator.mediaDevices?.getUserMedia) {
    micState({disabled: true, title: "Microphone needs https (or localhost)"});
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch (e) {
    micState({title: "Microphone unavailable: " + e.message});
    return;
  }

  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    micState({recording: false, busy: true, title: "Transcribing…"});
    try {
      const form = new FormData();
      form.append("audio", new Blob(chunks, {type: recorder.mimeType}), "speech.webm");
      const r = await api("voice/transcribe", {method: "POST", body: form});
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || `error ${r.status}`);
      const box = $("#composer");
      box.value = (box.value ? box.value + " " : "") + (data.text || "");
      box.dispatchEvent(new Event("input"));
      box.focus();
      micState({busy: false, title: `Record a message (heard ${data.language})`});
    } catch (e) {
      micState({busy: false, title: "Transcription failed: " + e.message});
      $("#chat-log").append(bubble("tool", "transcription failed: " + e.message));
    }
  };
  recorder.start();
  micState({recording: true, title: "Stop recording"});
});

async function loadConversations({selectLatest = false} = {}) {
  const convs = await json("chat/conversations");
  const list = $("#conv-list");
  list.textContent = "";
  if (!convs.length) {
    list.append(el("div", "conv-empty", "No conversations yet."));
    return;
  }
  // On first load the list would otherwise highlight a conversation the log is
  // not showing, so open the most recent rather than leaving a blank transcript.
  if (selectLatest && !CONV) await openConversation(convs[0].id);

  for (const c of convs) {
    const item = el("div", "conv-item");
    item.setAttribute("role", "listitem");
    item.dataset.id = c.id;
    item.setAttribute("aria-current", String(c.id === CONV));

    const open = el("button", "conv-title", c.title);
    open.type = "button";
    open.style.cssText = "background:none;border:0;color:inherit;font:inherit;" +
                         "text-align:left;cursor:pointer;padding:0;min-width:0;" +
                         "overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1";
    open.addEventListener("click", () => openConversation(c.id));

    const del = el("button", "conv-del", "✕");
    del.type = "button";
    del.title = "Delete conversation";
    del.setAttribute("aria-label", `Delete conversation: ${c.title}`);
    del.addEventListener("click", async e => {
      e.stopPropagation();
      await api(`chat/conversations/${c.id}`, {method: "DELETE"});
      if (CONV === c.id) { CONV = null; paintChat([]); }
      loadConversations();
    });

    item.append(open, del);
    list.append(item);
  }
}

/* ------------------------------------------------------------ activity -- */
async function loadActivity() {
  const list = $("#activity-list");
  try {
    const rows = await json("activity");
    list.textContent = "";
    if (!rows.length) {
      list.append(el("div", "empty", "Nothing recorded yet."));
      return;
    }
    for (const r of rows) {
      const row = el("div", "log-row");
      row.append(el("span", "log-when", new Date(r.at).toLocaleString()));
      row.append(el("span", "log-what", r.action));
      row.append(el("span", "log-detail",
                    (r.actor ? r.actor + " · " : "") + (r.detail || "")));
      list.append(row);
    }
  } catch (e) {
    list.textContent = "";
    list.append(el("div", "empty", e.message));
  }
}

/* ---------------------------------------------------------------- boot -- */
async function refreshHud() {
  $("#hud-model").textContent = VALUES["llm.model"] ?? "—";
  $("#hud-think").textContent = VALUES["llm.think"] ?? "—";
  try {
    const h = await json("health");
    $("#hud-ollama").textContent = h.ollama_ok ? "up" : "down";
  } catch { $("#hud-ollama").textContent = "unreachable"; }
}

function listen() {
  const es = new EventSource("settings/stream");
  es.onopen = () => { $("#dot").className = "dot live"; $("#conn").textContent = "live"; };
  es.onerror = () => { $("#dot").className = "dot down"; $("#conn").textContent = "reconnecting"; };
  es.onmessage = e => {
    Object.assign(VALUES, JSON.parse(e.data));
    for (const [key, control] of Object.entries(CONTROLS)) {
      if (control.contains && control.contains(document.activeElement)) continue;
      if (control === document.activeElement) continue;
      control.setValue?.(VALUES[key]);
    }
    refreshHud();
  };
}

(async function boot() {
  const [s, v, me] = await Promise.all([
    json("settings/schema"), json("settings/values"), json("auth/me"),
  ]);
  SCHEMA = s.properties || {};
  VALUES = v;
  $("#hud-user").textContent = `${me.username} · ${me.role}`;
  renderSettings();
  refreshHud();
  loadConversations({selectLatest: true});
  listen();
  $("#composer").focus();
})();
</script>
</body>
</html>
