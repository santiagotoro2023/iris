<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRiS</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <img src="logo.svg" alt="" width="46" height="46" class="brand-mark" id="brand-mark">
    <h1 class="wordmark">IR<span>i</span>S</h1>
    <span class="spacer"></span>
    <div class="user">
      <span class="user-id">
        <span class="user-name" id="user-name">&mdash;</span>
        <span class="user-role" id="user-role"></span>
      </span>
      <button class="iconbtn" id="logout" type="button" title="Sign out"
              aria-label="Sign out">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 17l5-5-5-5"/><path d="M20 12H9"/>
          <path d="M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="hud">
    <span><span id="dot" class="dot"></span><b id="conn">connecting</b></span>
    <span>model <b id="hud-model">—</b></span>
    <span>reasoning <b id="hud-think">—</b></span>
    <span>ollama <b id="hud-ollama">—</b></span>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-view="chat">Chat</button>
    <button class="tab" role="tab" aria-selected="false" data-view="conversations">Conversations</button>
    <button class="tab" role="tab" aria-selected="false" data-view="memory">Memory</button>
    <button class="tab" role="tab" aria-selected="false" data-view="settings">Settings</button>
    <button class="tab" role="tab" aria-selected="false" data-view="activity">Activity</button>
  </nav>

  <section class="view active" id="view-chat" role="tabpanel">
    <div class="chat-main">
      <div class="chat-log" id="chat-log"></div>
      <div id="attach-bar"></div>
      <div class="composer">
        <input type="file" id="file-input" hidden
               accept="image/*,.pdf,.docx,.txt,.md,.csv,.json,.yaml,.yml,.log,.py,.js,.ts,.sh,.sql,.html,.css,.xml,.toml">
        <button class="mic" id="attach" type="button" aria-label="Attach a file"
                title="Attach an image or document">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M21 12.5l-8.6 8.6a5 5 0 0 1-7-7l9-9a3.3 3.3 0 0 1 4.7 4.7l-9 9a1.7 1.7 0 0 1-2.3-2.3l8.3-8.3"/>
          </svg>
        </button>
        <button class="mic" id="mic" type="button" aria-label="Record a message"
                aria-pressed="false" title="Record a message">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>
          </svg>
        </button>
        <button class="mic" id="hands-free" type="button" aria-pressed="false"
                aria-label="Hands-free listening" title="Hands-free listening">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 13v-1a8 8 0 0 1 16 0v1"/>
            <path d="M4 13h2.4a1 1 0 0 1 1 1v3.6a1 1 0 0 1-1 1H5.6A1.6 1.6 0 0 1 4 17V13z"/>
            <path d="M20 13h-2.4a1 1 0 0 0-1 1v3.6a1 1 0 0 0 1 1h.8A1.6 1.6 0 0 0 20 17V13z"/>
          </svg>
        </button>
        <textarea id="composer" rows="1" placeholder="Ask IRiS…"
                  aria-label="Message"></textarea>
        <button class="btn" id="send" type="button">Send</button>
      </div>
    </div>
  </section>

  <section class="view" id="view-conversations" role="tabpanel">
    <div class="conv-panel">
      <div class="conv-head">
        <span>Conversations</span>
        <button class="ghost" id="new-chat" type="button">new</button>
      </div>
      <div class="conv-list" id="conv-list" role="list"></div>
    </div>
  </section>

  <section class="view" id="view-memory" role="tabpanel">
    <div class="panel">
      <h2>What IRiS remembers</h2>
      <div class="mem-add">
        <input class="input" id="mem-search" type="text" placeholder="Search memories…"
               aria-label="Search memories">
      </div>
      <div class="mem-add">
        <input class="input" id="mem-new" type="text" placeholder="Teach it something…"
               aria-label="New memory">
        <button class="btn" id="mem-save" type="button">Remember</button>
      </div>
      <div id="mem-list"><div class="empty">loading…</div></div>
    </div>
  </section>

  <section class="view" id="view-settings" role="tabpanel">
    <div id="groups"></div>
  </section>

  <section class="view" id="view-activity" role="tabpanel">
    <div class="panel">
      <h2>Activity &amp; audit log</h2>
      <div id="activity-list"><div class="empty">loading…</div></div>
    </div>
  </section>
</div>

<script src="app.js"></script>
<script>
const {$, el, api, json, send, Combo, Stepper, Toggle} = window.IRiS;
let SCHEMA = {}, VALUES = {}, CONTROLS = {}, CONV = null, BUSY = false;

/* ---------------------------------------------------------------- tabs -- */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t =>
      t.setAttribute("aria-selected", String(t === tab)));
    document.querySelectorAll(".view").forEach(v =>
      v.classList.toggle("active", v.id === "view-" + tab.dataset.view));
    if (tab.dataset.view === "activity") loadActivity();
    if (tab.dataset.view === "memory") loadMemories();
  });
});

$("#logout").addEventListener("click", async () => {
  await fetch("auth/logout", {method: "POST"});
  location.href = "login.html";
});

/* ------------------------------------------------------------ settings -- */
function rowFor(key, spec) {
  const row = el("div", "row");
  const id = "f-" + key.replace(/\./g, "-");
  const label = el("label", null, spec.title || key);
  label.id = id + "-label";
  label.htmlFor = id;
  row.append(label);
  if (spec.description) row.append(el("div", "desc", spec.description));

  const status = el("div", "status");
  const commit = v => save(key, v, status);
  let control;

  if (spec.enum) {
    control = Combo({options: spec.enum, value: VALUES[key], onChange: commit,
                     labelledBy: label.id});
  } else if (spec.type === "boolean") {
    control = Toggle({checked: VALUES[key], onChange: commit, labelledBy: label.id});
  } else if (spec.type === "integer" || spec.type === "number") {
    control = Stepper({value: VALUES[key], min: spec.minimum, max: spec.maximum,
                       step: spec.type === "integer" ? 1 : 0.1, onChange: commit, id});
  } else if (spec.format === "multiline") {
    control = el("textarea", "input multiline");
    control.id = id;
    control.rows = 12;
    control.value = VALUES[key] ?? "";
    let t;
    control.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => commit(control.value), 900);
    });
    control.setValue = v => { control.value = v ?? ""; };
  } else {
    control = el("input", "input");
    control.type = "text";
    control.id = id;
    control.value = VALUES[key] ?? "";
    let t;
    control.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => commit(control.value), 600);
    });
    control.setValue = v => { control.value = v ?? ""; };
  }

  CONTROLS[key] = control;
  row.append(control);

  // Auditioning is the only way to choose a voice, so put it next to the choice.
  if (key === "voice.tts_speaker") {
    const preview = el("button", "ghost", "preview voice");
    preview.type = "button";
    preview.style.marginTop = ".5rem";
    preview.addEventListener("click", async () => {
      preview.disabled = true;
      preview.textContent = "synthesising…";
      await speakText(
        "Certainly, Creator. Systems nominal, and I remain quietly delighted to be useful.",
        null);
      preview.textContent = "preview voice";
      preview.disabled = false;
    });
    row.append(preview);
  }

  row.append(status, el("div", "key", key));
  return row;
}

function renderSettings() {
  const groups = {};
  for (const [key, spec] of Object.entries(SCHEMA)) {
    const g = key.includes(".") ? key.split(".")[0] : "general";
    (groups[g] ||= []).push([key, spec]);
  }
  const root = $("#groups");
  root.textContent = "";
  for (const [name, items] of Object.entries(groups)) {
    const sec = el("section", "panel");
    sec.style.marginBottom = "1.1rem";
    sec.append(el("h2", null, name));
    items.forEach(([k, s]) => sec.append(rowFor(k, s)));
    root.append(sec);
  }
}

async function save(key, value, status) {
  status.textContent = "saving…";
  status.className = "status";
  try {
    VALUES = await send("settings/values", {[key]: value}, "PUT");
    status.textContent = "saved";
    status.className = "status ok";
    setTimeout(() => { status.textContent = ""; }, 1800);
    refreshHud();
  } catch (e) {
    status.textContent = e.message;
    status.className = "status err";
  }
}

/* ---------------------------------------------------------------- chat -- */
const SPEAKER_ICON =
  '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
  'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>';

/* One player for the whole page. Clicking a second speaker, or the same one again,
   stops what is playing instead of layering another voice on top. */
let currentAudio = null, currentBtn = null, currentPipeline = null, playToken = 0;

const STOP_ICON =
  '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">' +
  '<rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>';

/* The hands-free listener has to know when IRiS is talking: that is what stops it
   waking itself and what arms barge-in. Idempotent, so every playback path can
   call it freely. */
let speakingNow = false;
function setSpeaking(on) {
  if (speakingNow === on) return;
  speakingNow = on;
  reportSpeaking(on);
}

function setPlayIcon(btn, playing) {
  if (!btn) return;
  btn.innerHTML = playing ? STOP_ICON : SPEAKER_ICON;
  btn.classList.toggle("busy", playing);
  btn.title = playing ? "Stop" : "Play this reply";
  btn.setAttribute("aria-label", playing ? "Stop playback" : "Play this reply as speech");
}

function stopSpeech() {
  playToken++;
  setSpeaking(false);
  const p = currentPipeline;                  // automatic playback is a player too
  currentPipeline = null;
  p?.stop();
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  setPlayIcon(currentBtn, false);
  currentBtn = null;
}

async function speakText(text, btn) {
  if (btn && btn === currentBtn) { stopSpeech(); return; }   // second click stops
  stopSpeech();
  const token = ++playToken;
  currentBtn = btn;
  setPlayIcon(btn, true);
  setSpeaking(true);
  try {
    const r = await api("voice/speak", {
      method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify({text}),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.detail || `error ${r.status}`);
    }
    if (token !== playToken) return;            // superseded while synthesising
    const url = URL.createObjectURL(await r.blob());
    const audio = new Audio(url);
    currentAudio = audio;
    const done = () => {
      URL.revokeObjectURL(url);
      if (token === playToken) { currentAudio = null; setPlayIcon(btn, false);
                                 currentBtn = null; setSpeaking(false); }
    };
    audio.onended = done;
    audio.onerror = done;
    await audio.play();
  } catch (e) {
    if (token === playToken) { setPlayIcon(btn, false); currentBtn = null;
                               setSpeaking(false); }
    if (btn) btn.title = "Speech failed: " + e.message;
  }
}

function addSpeakButton(head, getText) {
  const play = el("button", "speak");
  play.type = "button";
  play.innerHTML = SPEAKER_ICON;
  play.title = "Play this reply";
  play.setAttribute("aria-label", "Play this reply as speech");
  play.addEventListener("click", () => speakText(getText(), play));
  head.append(play);
  return play;
}

/* Minimal inline markdown. The model still emits **bold** and `code`; showing the
   asterisks literally looks unfinished. Built as DOM nodes, never innerHTML. */
const INLINE = /(\*\*|__)(\S(?:[^\n]*?\S)?)\1|(?<![*\w])\*(\S(?:[^\n]*?\S)?)\*(?![*\w])|`([^`\n]+)`/g;

function renderInline(text, into) {
  let last = 0, m;
  INLINE.lastIndex = 0;
  while ((m = INLINE.exec(text)) !== null) {
    if (m.index > last) into.append(text.slice(last, m.index));
    if (m[2] !== undefined) into.append(el("strong", null, m[2]));
    else if (m[3] !== undefined) into.append(el("em", null, m[3]));
    else into.append(el("code", null, m[4]));
    last = m.index + m[0].length;
  }
  if (last < text.length) into.append(text.slice(last));
}

/* Block-level markdown. Lists and headings were shown as literal "- " and "#". */
function renderMarkdown(text, into) {
  into.textContent = "";
  const lines = String(text).split("\n");
  let list = null, listTag = null, fence = null, fenceLang = "";
  const closeList = () => { list = null; listTag = null; };

  for (const raw of lines) {
    const fenceMark = raw.match(/^\s*```(\w*)\s*$/);
    if (fenceMark) {
      if (fence) { fence = null; }             // closing
      else {
        closeList();
        fenceLang = fenceMark[1] || "";
        const pre = el("pre", "md-code");
        if (fenceLang) pre.dataset.lang = fenceLang;
        fence = el("code");
        pre.append(fence);
        into.append(pre);
      }
      continue;
    }
    if (fence) { fence.append(raw + "\n"); continue; }
    const line = raw.replace(/\s+$/, "");
    const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
    const ordered = line.match(/^\s*(\d{1,2})[.)]\s+(.*)$/);
    const heading = line.match(/^\s*#{1,6}\s+(.*)$/);

    if (bullet || ordered) {
      const tag = bullet ? "ul" : "ol";
      if (listTag !== tag) {
        closeList();
        list = el(tag, "md-list");
        listTag = tag;
        into.append(list);
      }
      const li = document.createElement("li");
      // Carry the real number, so a list broken by a paragraph does not restart at 1.
      if (ordered) li.value = Number(ordered[1]);
      renderInline(bullet ? bullet[1] : ordered[2], li);
      list.append(li);
      continue;
    }
    closeList();
    if (!line.trim()) continue;
    if (heading) {
      const h = el("div", "md-head");
      renderInline(heading[1], h);
      into.append(h);
      continue;
    }
    const para = el("div", "md-p");
    renderInline(line, para);
    into.append(para);
  }
  if (!into.childNodes.length) renderInline(String(text), into);
}

/* The search result is collapsed by default: a one-line note you can open to see
   every source and its URL, rather than a wall of scrape on every answer. */
const ENTITIES = {"&amp;": "&", "&lt;": "<", "&gt;": ">", "&quot;": '"', "&#39;": "'",
                  "&nbsp;": " ", "&#x27;": "'"};
const decode = s => String(s).replace(/&(amp|lt|gt|quot|nbsp|#39|#x27);/g,
                                      m => ENTITIES[m] ?? m);

function parseSources(content) {
  const out = [];
  for (const line of String(content).split("\n")) {
    const m = line.match(/^- (.*?) <(.+?)>\s*$/);
    if (m) { out.push({title: decode(m[1].trim()), url: m[2], snippet: ""}); continue; }
    if (out.length && /^\s+\S/.test(line)) {
      out[out.length - 1].snippet +=
        (out[out.length - 1].snippet ? " " : "") + decode(line.trim());
    }
  }
  return out;
}

function searchResult(query, content) {
  const sources = parseSources(content);
  const box = document.createElement("details");
  box.className = "tool-result";

  const summary = document.createElement("summary");
  summary.append(el("span", "chev-sm"), el("span", null,
    `Performed a web search${query ? ` for "${query}"` : ""}`
    + `, ${sources.length} source${sources.length === 1 ? "" : "s"}`));
  box.append(summary);

  if (!sources.length) {
    box.append(el("div", "src-snip", String(content).slice(0, 800)));
    return box;
  }
  const list = el("ol", "sources");
  for (const s of sources) {
    const li = document.createElement("li");
    const a = el("a", "src-title", s.title || s.url);
    a.href = s.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    li.append(a, el("div", "src-url", s.url));
    if (s.snippet) li.append(el("div", "src-snip", s.snippet));
    list.append(li);
  }
  box.append(list);
  return box;
}

function attachmentBlock(a) {
  const box = document.createElement("details");
  box.className = "tool-result attachment";
  const summary = document.createElement("summary");
  summary.append(el("span", "chev-sm"),
                 el("span", null, `${a.kind}: ${a.name}`));
  box.append(summary, el("div", "src-snip", a.text || ""));
  return box;
}

function bubble(role, content, attachments) {
  const m = el("div", "msg " + role);
  const head = el("div", "msg-role");
  if (role === "user") {
    head.remove();            // the alignment already says who is speaking
  } else if (role === "assistant") {
    const mark = document.createElement("img");
    mark.src = $("#brand-mark").getAttribute("src");
    mark.width = mark.height = 30;
    mark.alt = "IRiS";
    mark.className = "bubble-mark";
    head.append(mark);
  } else {
    head.append(document.createTextNode(role));
  }
  const body = el("div", "msg-body");
  if (content) renderMarkdown(content, body);
  if (role === "assistant" && (content || "").trim()) {
    addSpeakButton(head, () => body.textContent);
  }
  if (role !== "user") m.append(head);
  m.append(body);
  // One container: the text, then its attachments beneath a divider, stacked.
  for (const a of attachments || []) m.append(attachmentBlock(a));
  m.head = head;
  m.body = body;
  return m;
}

/* ------------------------------------------------- sentence-wise speech -- */
/* Synthesise and play one sentence at a time, so the next renders while the
   current plays and nothing waits for the whole reply (SPEC.md 16). */
const SENTENCE_END = /^([\s\S]*?(?:[.!?…]+["')\]]*|\n))(\s*)/;
const MIN_SENTENCE = 12;

function takeSentences(buffer) {
  const out = [];
  let rest = buffer, m;
  while ((m = SENTENCE_END.exec(rest))) {
    const sentence = m[1].trim();
    // Too-short fragments ("Dr.", "3.5 ") are held back and merged with what follows.
    if (sentence.length < MIN_SENTENCE) break;
    out.push(sentence);
    rest = rest.slice(m[0].length);
  }
  return [out, rest];
}

async function synthesise(text) {
  const r = await api("voice/speak", {
    method: "POST", headers: {"content-type": "application/json"},
    body: JSON.stringify({text}),
  });
  if (!r.ok) return null;
  return URL.createObjectURL(await r.blob());
}

function playUrl(url) {
  return new Promise(resolve => {
    const audio = new Audio(url);
    currentAudio = audio;
    const done = () => { URL.revokeObjectURL(url); if (currentAudio === audio)
                           currentAudio = null; resolve(); };
    audio.onended = done;
    audio.onerror = done;
    audio.play().catch(done);
  });
}

function speechPipeline(btn) {
  const queue = [];
  let draining = false, stopped = false, ended = false;

  // Automatic playback holds the reply's speaker button exactly as a manual play
  // does, so the icon is a stop button whenever anything is actually speaking.
  function claim() {
    if (currentPipeline === self) return;
    stopSpeech();
    currentPipeline = self;
    currentBtn = btn;
    setPlayIcon(btn, true);
    setSpeaking(true);
  }
  function release() {
    if (currentPipeline !== self) return;
    currentPipeline = null;
    setPlayIcon(currentBtn, false);
    currentBtn = null;
    setSpeaking(false);
  }

  async function drain() {
    if (draining) return;
    draining = true;
    while (queue.length && !stopped) {
      try {
        const url = await queue.shift();
        if (url && !stopped) await playUrl(url);
      } catch { /* one bad sentence must not kill the rest */ }
    }
    draining = false;
    // An empty queue mid-reply is just the generator being slower than the voice.
    if (ended || stopped) release();
  }

  const self = {
    push(sentence) {
      if (stopped || !sentence.trim()) return;
      claim();
      queue.push(synthesise(sentence));   // starts now; playback stays in order
      drain();
    },
    finish() {                            // no more sentences are coming
      ended = true;
      if (!draining) release();
    },
    stop() {
      stopped = true;
      queue.length = 0;
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      release();
    },
  };
  return self;
}

function paintChat(messages) {
  const log = $("#chat-log");
  log.textContent = "";
  let lastCalls = [];        // a stored tool turn does not carry its own arguments
  for (const m of messages) {
    if (m.role === "user") {
      log.append(bubble("user", m.content, m.attachments));
    } else if (m.role === "tool") {
      const b = el("div", "msg tool");
      if (m.tool_name === "web_search") {
        const call = lastCalls.find(c => c?.function?.name === "web_search");
        b.append(searchResult(call?.function?.arguments?.query ?? "", m.content));
      } else {
        b.append(el("div", "tool-line", `${m.tool_name}: ${m.content}`));
      }
      log.append(b);
    } else if (m.role === "assistant") {
      lastCalls = m.tool_calls || [];
      if ((m.content || "").trim()) log.append(bubble("assistant", m.content));
    }
  }
  log.scrollTop = log.scrollHeight;
}


async function sendMessage() {
  const box = $("#composer");
  const text = box.value.trim();
  if ((!text && !ATTACHMENTS.length) || BUSY) return;
  const sending = ATTACHMENTS.slice();
  BUSY = true;
  $("#send").disabled = true;
  box.value = "";
  box.style.height = "auto";

  const log = $("#chat-log");
  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  log.append(bubble("user", text, sending));

  const live = bubble("assistant", "");
  const spinner = el("span", "thinking");
  spinner.append(el("i"), el("i"), el("i"));
  live.body.append(spinner);
  log.append(live);
  log.scrollTop = log.scrollHeight;

  let pipeline = null;                 // built with the button, at the first delta
  let shown = "", pending = "", first = true;

  const onEvent = ev => {
    if (ev.type === "start") {
      CONV = ev.conversation_id;
    } else if (ev.type === "delta") {
      if (first) {
        live.body.textContent = "";
        first = false;
        const btn = addSpeakButton(live.head, () => live.body.textContent);
        if (VALUES["voice.speak_replies"]) pipeline = speechPipeline(btn);
      }
      const stick = atBottom();
      shown = (shown + ev.text).replace(/\s+,/g, ",");
      renderMarkdown(shown, live.body);
      if (pipeline) {
        pending += ev.text;
        const [sentences, rest] = takeSentences(pending);
        pending = rest;
        sentences.forEach(s => pipeline.push(s));
      }
      if (stick) log.scrollTop = log.scrollHeight;
    } else if (ev.type === "tool_start") {
      const q = ev.arguments?.query ?? "";
      const b = el("div", "msg tool searching");
      b.dataset.query = q;
      const line = el("div", "tool-line");
      const spin = el("span", "thinking");
      spin.append(el("i"), el("i"), el("i"));
      line.append(spin, el("span", null, ev.name === "web_search"
        ? `Searching the web${q ? ` for "${q}"` : ""}` : `Running ${ev.name}`));
      b.append(line);
      log.insertBefore(b, live);
      log.scrollTop = log.scrollHeight;
    } else if (ev.type === "tool") {
      // Replace the in-flight indicator rather than stacking a second bubble.
      const pending = [...log.querySelectorAll(".msg.tool.searching")].pop();
      const target = pending || el("div", "msg tool");
      const query = target.dataset?.query || "";
      target.className = "msg tool";
      target.textContent = "";
      target.append(ev.name === "web_search"
        ? searchResult(query, ev.content)
        : el("div", "tool-line", `${ev.name}: ${ev.content.slice(0, 200)}`));
      if (!pending) log.insertBefore(target, live);
      log.scrollTop = log.scrollHeight;
    } else if (ev.type === "done") {
      if (pipeline && pending.trim()) { pipeline.push(pending.trim()); pending = ""; }
      pipeline?.finish();
    } else if (ev.type === "error") {
      throw new Error(ev.detail);
    }
  };

  try {
    const r = await api("chat/stream", {
      method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify({content: text, conversation_id: CONV,
                            attachments: ATTACHMENTS.length ? ATTACHMENTS : undefined}),
    });
    if (!r.ok || !r.body) throw new Error(`stream failed (${r.status})`);
    ATTACHMENTS = [];
    renderAttachBar();

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let partial = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      partial += decoder.decode(value, {stream: true});
      const lines = partial.split("\n");
      partial = lines.pop();          // last piece may be an incomplete line
      for (const line of lines) {
        if (line.trim()) onEvent(JSON.parse(line));
      }
    }
    if (partial.trim()) onEvent(JSON.parse(partial));
    loadConversations();
  } catch (e) {
    pipeline?.stop();
    if (first) live.remove();
    log.append(bubble("tool", "error: " + e.message));
  } finally {
    BUSY = false;
    $("#send").disabled = false;
    box.focus();
  }
}

$("#send").addEventListener("click", sendMessage);
$("#composer").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$("#composer").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 144) + "px";
});
$("#new-chat").addEventListener("click", () => {
  CONV = null;
  paintChat([]);
  showView("chat");
  document.querySelectorAll(".conv-item").forEach(n =>
    n.setAttribute("aria-current", "false"));
  $("#composer").focus();
});

function showView(name) {
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.view === name)));
  document.querySelectorAll(".view").forEach(v =>
    v.classList.toggle("active", v.id === "view-" + name));
}

async function openConversation(id, {focusChat = false} = {}) {
  CONV = id;
  paintChat((await json(`chat/conversations/${id}`)).messages);
  document.querySelectorAll(".conv-item").forEach(n =>
    n.setAttribute("aria-current", String(n.dataset.id === id)));
  if (focusChat) showView("chat");
}

/* ----------------------------------------------------------- attachments -- */
let ATTACHMENTS = [];

function renderAttachBar() {
  const bar = $("#attach-bar");
  bar.textContent = "";
  for (const a of ATTACHMENTS) {
    const chip = el("span", "chip");
    chip.append(el("span", "chip-kind", a.kind), el("span", "chip-name", a.name));
    const x = el("button", "chip-x", "\u2715");
    x.type = "button";
    x.title = "Remove";
    x.setAttribute("aria-label", `Remove ${a.name}`);
    x.addEventListener("click", () => {
      ATTACHMENTS = ATTACHMENTS.filter(o => o !== a);
      renderAttachBar();
    });
    chip.append(x);
    bar.append(chip);
  }
}

$("#attach").addEventListener("click", () => $("#file-input").click());
$("#file-input").addEventListener("change", async e => {
  const file = e.target.files?.[0];
  e.target.value = "";
  if (!file) return;

  const pending = el("span", "chip pending");
  const spin = el("span", "thinking");
  spin.append(el("i"), el("i"), el("i"));
  pending.append(spin, el("span", "chip-name", `reading ${file.name}`));
  $("#attach-bar").append(pending);

  try {
    const form = new FormData();
    form.append("file", file);
    const r = await api("files/analyze", {method: "POST", body: form});
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || `error ${r.status}`);
    ATTACHMENTS.push(data);
    renderAttachBar();
  } catch (err) {
    pending.remove();
    $("#chat-log").append(bubble("tool", `could not read ${file.name}: ${err.message}`));
  }
});

/* --------------------------------------------------------------- voice -- */
let recorder = null, chunks = [];

function micState({recording = false, busy = false, disabled = false, title} = {}) {
  const mic = $("#mic");
  mic.setAttribute("aria-pressed", String(recording));
  mic.classList.toggle("busy", busy);
  mic.disabled = disabled;
  if (title) mic.title = title;
}

$("#mic").addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }

  // getUserMedia needs a secure context: localhost is fine, plain http over
  // Tailscale is not. `tailscale serve` terminates TLS if you need it remotely.
  if (!navigator.mediaDevices?.getUserMedia) {
    micState({disabled: true, title: "Microphone needs https (or localhost)"});
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch (e) {
    micState({title: "Microphone unavailable: " + e.message});
    return;
  }

  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    micState({recording: false, busy: true, title: "Transcribing…"});
    try {
      const form = new FormData();
      form.append("audio", new Blob(chunks, {type: recorder.mimeType}), "speech.webm");
      const r = await api("voice/transcribe", {method: "POST", body: form});
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || `error ${r.status}`);
      const box = $("#composer");
      box.value = (box.value ? box.value + " " : "") + (data.text || "");
      box.dispatchEvent(new Event("input"));
      box.focus();
      micState({busy: false, title: `Record a message (heard ${data.language})`});
    } catch (e) {
      micState({busy: false, title: "Transcription failed: " + e.message});
      $("#chat-log").append(bubble("tool", "transcription failed: " + e.message));
    }
  };
  recorder.start();
  micState({recording: true, title: "Stop recording"});
});

/* ---------------------------------------------------------- hands-free -- */
/* The wake word runs on the server, so this end is only a microphone: it ships
   16 kHz mono Int16 frames up a WebSocket and reacts to what comes back. The
   transcript is handed to the ordinary send path, so a spoken turn and a typed
   one are the same conversation. */

// AudioWorklet, not the deprecated ScriptProcessorNode. Loaded from a blob URL,
// which inherits this document's origin — note that adding a CSP later would need
// `script-src blob:` for this to keep working.
const CAPTURE_WORKLET = `
class Capture extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(1280); this.n = 0;
                  this.ratio = sampleRate / 16000; this.pos = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    // Decimate by averaging, so 48 kHz folds to 16 kHz without aliasing the
    // wake word into noise. A plain sample-drop measurably hurt detection.
    for (; this.pos < ch.length; this.pos += this.ratio) {
      const i = this.pos | 0;
      let sum = 0, k = 0;
      for (let j = i; j < i + this.ratio && j < ch.length; j++) { sum += ch[j]; k++; }
      const v = k ? sum / k : 0;
      this.buf[this.n++] = Math.max(-1, Math.min(1, v)) * 32767;
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.slice().buffer);
        this.n = 0;
      }
    }
    this.pos -= ch.length;
    return true;
  }
}
registerProcessor("capture", Capture);
`;

let hf = null;   // {ws, ctx, stream, node} while hands-free is running

function hfState(state, title) {
  const btn = $("#hands-free");
  btn.setAttribute("aria-pressed", String(state !== "off"));
  btn.classList.toggle("busy", state === "thinking");
  btn.classList.toggle("hearing", state === "awake");
  btn.title = title;
  $("#mic").disabled = state !== "off";
  if (state !== "off" && !$("#mic").title.includes("Hands-free"))
    $("#mic").title = "Hands-free listening is on";
}

async function startHandsFree() {
  if (hf) return;
  if (!navigator.mediaDevices?.getUserMedia) {
    hfState("off", "Microphone needs https (or localhost)");
    return;
  }
  let stream, ctx, node;
  try {
    // Echo cancellation is what stops IRiS's own voice from reaching the wake
    // word detector and from tripping barge-in on every reply.
    stream = await navigator.mediaDevices.getUserMedia({audio: {
      echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
    ctx = new AudioContext({sampleRate: 16000});
    await ctx.audioWorklet.addModule(
      URL.createObjectURL(new Blob([CAPTURE_WORKLET], {type: "application/javascript"})));
    node = new AudioWorkletNode(ctx, "capture");
  } catch (e) {
    stream?.getTracks().forEach(t => t.stop());
    await ctx?.close();
    hfState("off", "Microphone unavailable: " + e.message);
    return;
  }

  const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/voice/listen");
  ws.binaryType = "arraybuffer";
  hf = {ws, ctx, stream, node};

  node.port.onmessage = e => { if (ws.readyState === 1) ws.send(e.data); };
  ctx.createMediaStreamSource(stream).connect(node);

  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "ready") hfState("listening", `Listening for "${m.wake_word}"`);
    else if (m.type === "wake") hfState("awake", "Go ahead");
    else if (m.type === "listening") hfState("awake", "Listening");
    else if (m.type === "idle") hfState("listening", "Listening for the wake word");
    else if (m.type === "thinking") hfState("thinking", "Working out what you said");
    else if (m.type === "barge_in") { stopSpeech(); hfState("awake", "Listening"); }
    else if (m.type === "transcript") {
      hfState("listening", "Listening for the wake word");
      const box = $("#composer");
      box.value = m.text;
      sendMessage();
    } else if (m.type === "error") {
      $("#chat-log").append(bubble("tool", "hands-free: " + m.detail));
      stopHandsFree();
    }
  };
  ws.onclose = () => { if (hf) stopHandsFree(); };
  ws.onerror = () => hfState("off", "Hands-free connection failed");
}

function stopHandsFree() {
  if (!hf) return;
  const {ws, ctx, stream, node} = hf;
  hf = null;                      // before close(), so onclose does not recurse
  node.port.onmessage = null;
  node.disconnect();
  stream.getTracks().forEach(t => t.stop());   // releases the microphone indicator
  ctx.close();
  if (ws.readyState <= 1) ws.close();
  hfState("off", "Hands-free listening");
}

/* The server cannot hear IRiS's own playback, so the page has to say so —
   that is what suppresses self-triggering and arms barge-in. */
function reportSpeaking(value) {
  if (hf?.ws.readyState === 1)
    hf.ws.send(JSON.stringify({type: "speaking", value}));
}

/* The button and the Settings toggle are the same switch: the button writes
   voice.hands_free and the live settings feed drives the microphone, so the two
   controls can never disagree. */
function syncHandsFree() {
  if (VALUES["voice.hands_free"] && !hf) startHandsFree();
  else if (!VALUES["voice.hands_free"] && hf) stopHandsFree();
}

$("#hands-free").addEventListener("click", async () => {
  const want = !hf;
  try {
    VALUES = await send("settings/values", {"voice.hands_free": want}, "PUT");
  } catch (e) {
    hfState(hf ? "listening" : "off", "Could not save: " + e.message);
    return;
  }
  syncHandsFree();
});
// Release the microphone when the page goes away, without turning the setting off.
window.addEventListener("pagehide", stopHandsFree);

/* -------------------------------------------------------------- memory -- */
async function loadMemories() {
  const q = $("#mem-search").value.trim();
  const list = $("#mem-list");
  const {memories} = await json("memory" + (q ? "?q=" + encodeURIComponent(q) : ""));
  list.textContent = "";
  if (!memories.length) {
    list.append(el("div", "empty", q ? "Nothing matches." : "Nothing remembered yet."));
    return;
  }
  for (const m of memories) {
    const row = el("div", "mem-row");
    row.append(el("div", "mem-text", m.text));
    const meta = el("div", "mem-meta");
    // A score only exists on a search result; showing "0" on the full list would lie.
    if (m.score !== undefined) meta.append(el("span", "mem-score", m.score.toFixed(2)));
    if (m.created) meta.append(el("span", null, new Date(m.created * 1000)
      .toLocaleDateString(undefined, {day: "2-digit", month: "short", year: "numeric"})));
    meta.append(el("span", "mem-kind", m.source || m.kind || "fact"));
    const del = el("button", "ghost", "forget");
    del.type = "button";
    del.addEventListener("click", async () => {
      del.disabled = true;
      await json("memory/" + encodeURIComponent(m.id), {method: "DELETE"});
      loadMemories();
    });
    meta.append(del);
    row.append(meta);
    list.append(row);
  }
}

$("#mem-save").addEventListener("click", async () => {
  const box = $("#mem-new");
  if (!box.value.trim()) return;
  $("#mem-save").disabled = true;
  try { await send("memory", {text: box.value.trim()}, "POST"); box.value = ""; }
  catch (e) { $("#mem-list").prepend(el("div", "empty", "Could not save: " + e.message)); }
  $("#mem-save").disabled = false;
  loadMemories();
});
$("#mem-new").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); $("#mem-save").click(); }
});
let memSearchTimer;
$("#mem-search").addEventListener("input", () => {
  clearTimeout(memSearchTimer);
  memSearchTimer = setTimeout(loadMemories, 300);
});

async function loadConversations({selectLatest = false} = {}) {
  const convs = await json("chat/conversations");
  const list = $("#conv-list");
  list.textContent = "";
  if (!convs.length) {
    list.append(el("div", "conv-empty", "No conversations yet."));
    return;
  }
  // On first load the list would otherwise highlight a conversation the log is
  // not showing, so open the most recent rather than leaving a blank transcript.
  if (selectLatest && !CONV) await openConversation(convs[0].id);

  for (const c of convs) {
    const item = el("div", "conv-item");
    item.setAttribute("role", "listitem");
    item.dataset.id = c.id;
    item.setAttribute("aria-current", String(c.id === CONV));

    const open = el("button", "conv-title", c.title);
    open.type = "button";
    open.style.cssText = "background:none;border:0;color:inherit;font:inherit;" +
                         "text-align:left;cursor:pointer;padding:0;min-width:0;" +
                         "overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1";
    open.addEventListener("click", () => openConversation(c.id, {focusChat: true}));

    const del = el("button", "conv-del", "✕");
    del.type = "button";
    del.title = "Delete conversation";
    del.setAttribute("aria-label", `Delete conversation: ${c.title}`);
    del.addEventListener("click", async e => {
      e.stopPropagation();
      await api(`chat/conversations/${c.id}`, {method: "DELETE"});
      if (CONV === c.id) { CONV = null; paintChat([]); }
      loadConversations();
    });

    item.append(open, del);
    list.append(item);
  }
}

/* ------------------------------------------------------------ activity -- */
async function loadActivity() {
  const list = $("#activity-list");
  try {
    const rows = await json("activity");
    list.textContent = "";
    if (!rows.length) {
      list.append(el("div", "empty", "Nothing recorded yet."));
      return;
    }
    for (const r of rows) {
      const row = el("div", "log-row");
      row.append(el("span", "log-when", new Date(r.at).toLocaleString()));
      row.append(el("span", "log-what", r.action));
      row.append(el("span", "log-detail",
                    (r.actor ? r.actor + " · " : "") + (r.detail || "")));
      list.append(row);
    }
  } catch (e) {
    list.textContent = "";
    list.append(el("div", "empty", e.message));
  }
}

/* ---------------------------------------------------------------- boot -- */
async function refreshHud() {
  $("#hud-model").textContent = VALUES["llm.model"] ?? "—";
  $("#hud-think").textContent = VALUES["llm.think"] ?? "—";
  try {
    const h = await json("health");
    $("#hud-ollama").textContent = h.ollama_ok ? "up" : "down";
  } catch { $("#hud-ollama").textContent = "unreachable"; }
}

function listen() {
  const es = new EventSource("settings/stream");
  es.onopen = () => { $("#dot").className = "dot live"; $("#conn").textContent = "live"; };
  es.onerror = () => { $("#dot").className = "dot down"; $("#conn").textContent = "reconnecting"; };
  es.onmessage = e => {
    Object.assign(VALUES, JSON.parse(e.data));
    for (const [key, control] of Object.entries(CONTROLS)) {
      if (control.contains && control.contains(document.activeElement)) continue;
      if (control === document.activeElement) continue;
      control.setValue?.(VALUES[key]);
    }
    refreshHud();
    syncHandsFree();
  };
}

(async function boot() {
  const [s, v, me] = await Promise.all([
    json("settings/schema"), json("settings/values"), json("auth/me"),
  ]);
  SCHEMA = s.properties || {};
  VALUES = v;
  $("#user-name").textContent = me.username;
  // "creator / creator" reads as a mistake; only show the role when it adds something.
  $("#user-role").textContent =
    me.role.toLowerCase() === me.username.toLowerCase() ? "" : me.role;
  renderSettings();
  refreshHud();
  loadConversations({selectLatest: true});
  listen();
  syncHandsFree();
  $("#composer").focus();
})();
</script>
