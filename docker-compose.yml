services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis holds conversations, not just sessions — real user content that must
    # survive a container recreate, so it gets AOF persistence and a volume.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build: ./api
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      IRIS_MODEL: ${IRIS_MODEL:-qwen3:8b}
      IRIS_TZ: ${IRIS_TZ:-Europe/Zurich}
      IRIS_THINK: ${IRIS_THINK:-false}
      IRIS_COOKIE_SECURE: ${IRIS_COOKIE_SECURE:-0}
    depends_on:
      ollama:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    ports:
      - "127.0.0.1:1883:1883"
