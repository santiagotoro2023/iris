services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis holds conversations, not just sessions — real user content that must
    # survive a container recreate, so it gets AOF persistence and a volume.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build: ./api
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      STT_URL: http://stt:8001
      TTS_URL: http://tts:8002
      SEARXNG_URL: http://searxng:8080
      IRIS_MODEL: ${IRIS_MODEL:-qwen3:8b}
      IRIS_VISION_MODEL: ${IRIS_VISION_MODEL:-qwen2.5vl:3b}
      IRIS_EMBED_MODEL: ${IRIS_EMBED_MODEL:-bge-m3}
      QDRANT_URL: http://qdrant:6333
      FRIGATE_URL: http://frigate:5000
      IRIS_BACKUP_KEY: ${IRIS_BACKUP_KEY:-}
      IRIS_TZ: ${IRIS_TZ:-Europe/Zurich}
      IRIS_THINK: ${IRIS_THINK:-}
      IRIS_COOKIE_SECURE: ${IRIS_COOKIE_SECURE:-0}
    volumes:
      # Custom wake word models only. The bundled ones live in the image.
      - ./data/wakewords:/wakewords
      # Encrypted archives. Gitignored: this repo is public (SPEC.md 4).
      - ./backup:/backup
      # Frigate's config is generated from the device registry, not hand-written.
      - ./data/frigate:/frigate
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  stt:
    build: ./stt
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    environment:
      STT_MODEL: ${STT_MODEL:-large-v3}
      STT_DEVICE: ${STT_DEVICE:-cuda}
      STT_COMPUTE: ${STT_COMPUTE:-int8_float16}
    volumes:
      - ./data/whisper:/models
    ports:
      - "127.0.0.1:8001:8001"

  tts:
    build: ./tts
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    environment:
      TTS_ENGINE: ${TTS_ENGINE:-piper}
      TTS_SPEAKER: ${TTS_SPEAKER:-en_GB-cori-high}
      TTS_DEVICE: ${TTS_DEVICE:-cuda}
    volumes:
      - ./data/tts:/models
    ports:
      - "127.0.0.1:8002:8002"

  # Continuous recording and CPU object detection. Only started when there is a
  # camera to point it at: Frigate refuses to boot with an empty camera list, and
  # its config is generated from the device registry (SPEC.md 37).
  #   docker compose --profile cameras up -d frigate
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    profiles: ["cameras"]
    restart: unless-stopped
    shm_size: "128mb"
    volumes:
      - ./data/frigate:/config
      - ./data/media/frigate:/media/frigate
    environment:
      FRIGATE_MQTT_HOST: mqtt
    depends_on:
      mqtt:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    ports:
      - "127.0.0.1:8080:8080"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    environment:
      # The voice model must be resident at the same time as the language model for
      # per-sentence speech to overlap generation, and on 7.8 GiB they do not both fit
      # at full precision. A quantised KV cache buys the headroom (SPEC.md 17).
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    ports:
      - "127.0.0.1:1883:1883"
